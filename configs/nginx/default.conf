# Shared per-IP zones (applies before requests hit Spring Boot)
limit_req_zone $binary_remote_addr zone=global_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=payment_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=support_send_per_ip:10m rate=30r/m;

upstream migros_backend {
    # Compose service DNS; the backend is intentionally not published on the host.
    server backend:8080;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # Always return 429 when a limit is exceeded.
    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        add_header Content-Type application/json always;
        add_header Retry-After 60 always;
        return 429 '{"error":"Too Many Requests"}';
    }

    # Local container liveness probe; never proxied to the backend.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 'ok';
    }

    # WebSocket endpoint (support chat)
    location /ws/support {
        limit_req zone=global_per_ip burst=40 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://migros_backend;
    }

    # Strict auth protection against credential stuffing.
    location = /admin/login {
        limit_req zone=login_per_ip burst=10 nodelay;
        proxy_pass http://migros_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location = /user/login {
        limit_req zone=login_per_ip burst=10 nodelay;
        proxy_pass http://migros_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Strict payment throttling (charge is scoped to a server-issued checkout id).
    location ~ ^/payment/checkouts/[0-9a-fA-F-]+/charge$ {
        limit_req zone=payment_per_ip burst=10 nodelay;
        proxy_pass http://migros_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Tighten live-support send spam.
    location = /user/support/send {
        limit_req zone=support_send_per_ip burst=20 nodelay;
        proxy_pass http://migros_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Internal support bridge is backend-only; never expose it through the edge proxy.
    location /internal/ {
        return 404;
    }

    # Default limit for all other HTTP endpoints.
    location / {
        limit_req zone=global_per_ip burst=40 nodelay;
        proxy_pass http://migros_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}
