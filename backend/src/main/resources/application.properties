spring.application.name=MigrosBackend
server.port=${PORT:8080}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql = false
spring.jpa.hibernate.naming.implicit-strategy = org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=validate

# Flyway owns the full relational schema, including the legacy money-column
# conversion (REAL -> NUMERIC(19, 2)) and the payment-critical checkout/payment
# constraints. V5 (payment-schema reconciliation) completes a fresh database
# and normalizes upgraded ones, so Hibernate only validates the mappings and
# never silently repairs production schema at runtime. Startup fails fast on
# any mapping/schema disagreement instead of running against a weak schema.

# Flyway owns the legacy money-column conversion (REAL -> NUMERIC(19, 2)). The
# baseline version is 0 so that an existing non-empty schema without migration
# history is baselined below V1 and V1 still runs; an empty schema applies V1
# directly. Flyway runs before Hibernate, and V5 completes/reconciles the full
# schema, so Hibernate validation (see ddl-auto above) never needs to create
# missing tables.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}
app.mail.provider=${APP_MAIL_PROVIDER:auto}
resend.api.key=${RESEND_API_KEY:}
app.mail.from=${APP_MAIL_FROM:no-reply@localhost}

logging.file.name=./logs/authentication-failures.log

stripe.api.key=${STRIPE_API_KEY:}
# ISO 4217 charge currency passed to Stripe. Stored prices are major-unit TRY
# amounts, so the default is Turkish lira.
payment.currency=${PAYMENT_CURRENCY:try}
# Lifetime of an immutable checkout snapshot before its reserved stock is
# released. The charge endpoint only accepts snapshots inside this window.
payment.checkout.ttl-minutes=${PAYMENT_CHECKOUT_TTL_MINUTES:15}
# Bounded lease that prevents two duplicate charge requests from both becoming
# active workers. An expired lease is reclaimed with the same idempotency key.
payment.attempt.lease-seconds=${PAYMENT_ATTEMPT_LEASE_SECONDS:120}
# Bounded reconciliation of attempts stuck in a recoverable state.
payment.recovery.scan-ms=${PAYMENT_RECOVERY_SCAN_MS:60000}
payment.recovery.initial-delay-ms=${PAYMENT_RECOVERY_INITIAL_DELAY_MS:60000}
payment.recovery.stale-after-seconds=${PAYMENT_RECOVERY_STALE_AFTER_SECONDS:300}
# Required outside exact-local development; verifies Stripe webhook signatures.
payment.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
# Durable webhook inbox: receipt/claim/completion are separate commits so a
# crash at any boundary leaves the event retryable. Only PROCESSED counts as
# complete. Stored raw payloads are sensitive operational data: never logged,
# never exposed via the API, and deleted only after the retention period below
# and only for PROCESSED events. Secrets and signatures are never stored.
payment.webhook.inbox-lease-seconds=${PAYMENT_WEBHOOK_INBOX_LEASE_SECONDS:120}
payment.webhook.inbox-max-attempts=${PAYMENT_WEBHOOK_INBOX_MAX_ATTEMPTS:8}
payment.webhook.inbox-backoff-base-seconds=${PAYMENT_WEBHOOK_INBOX_BACKOFF_BASE_SECONDS:60}
payment.webhook.inbox-backoff-max-seconds=${PAYMENT_WEBHOOK_INBOX_BACKOFF_MAX_SECONDS:3600}
payment.webhook.inbox-scan-ms=${PAYMENT_WEBHOOK_INBOX_SCAN_MS:60000}
payment.webhook.inbox-initial-delay-ms=${PAYMENT_WEBHOOK_INBOX_INITIAL_DELAY_MS:60000}
payment.webhook.inbox-page-size=${PAYMENT_WEBHOOK_INBOX_PAGE_SIZE:20}
payment.webhook.inbox-retention-days=${PAYMENT_WEBHOOK_INBOX_RETENTION_DAYS:30}
payment.webhook.inbox-cleanup-scan-ms=${PAYMENT_WEBHOOK_INBOX_CLEANUP_SCAN_MS:3600000}
payment.webhook.inbox-cleanup-initial-delay-ms=${PAYMENT_WEBHOOK_INBOX_CLEANUP_INITIAL_DELAY_MS:3600000}
support.service.internal-key=${SUPPORT_SERVICE_INTERNAL_KEY:}

support.internal.key=${SUPPORT_INTERNAL_KEY:}

# Durable outbox for events owed to the external support service. Each chat
# message creation/edit/delete writes an outbox row in the same transaction as
# the message itself; this worker claims due rows with a bounded lease, delivers
# them outside any transaction, and retries failures with backoff.
# Delivery is AT LEAST ONCE and never terminal: a request that succeeded on the
# receiver but whose response was lost is retried, and the stable eventId inside
# the payload lets the receiver deduplicate. Per-customer ordering is preserved,
# so a retry never overtakes an earlier undelivered event for the same
# conversation. SUPPORT_OUTBOX_ALERT_AFTER_ATTEMPTS only raises the failure log to
# ERROR for operator attention; it is never a delivery budget.
support.outbox.lease-seconds=${SUPPORT_OUTBOX_LEASE_SECONDS:120}
support.outbox.alert-after-attempts=${SUPPORT_OUTBOX_ALERT_AFTER_ATTEMPTS:8}
support.outbox.backoff-base-seconds=${SUPPORT_OUTBOX_BACKOFF_BASE_SECONDS:30}
support.outbox.backoff-max-seconds=${SUPPORT_OUTBOX_BACKOFF_MAX_SECONDS:1800}
support.outbox.page-size=${SUPPORT_OUTBOX_PAGE_SIZE:20}
support.outbox.retention-days=${SUPPORT_OUTBOX_RETENTION_DAYS:30}
support.outbox.scan-ms=${SUPPORT_OUTBOX_SCAN_MS:5000}
support.outbox.initial-delay-ms=${SUPPORT_OUTBOX_INITIAL_DELAY_MS:5000}
support.outbox.cleanup-scan-ms=${SUPPORT_OUTBOX_CLEANUP_SCAN_MS:3600000}
support.outbox.cleanup-initial-delay-ms=${SUPPORT_OUTBOX_CLEANUP_INITIAL_DELAY_MS:3600000}

# Timeouts for the outbound support-service call. They must stay shorter than
# support.outbox.lease-seconds: a delivery that outlives its lease gets reclaimed
# and delivered again by another worker while the first request is still in
# flight. Startup fails if either is not shorter, rather than silently
# weakening the at-least-once guarantee into concurrent duplicate delivery.
support.service.connect-timeout-ms=${SUPPORT_SERVICE_CONNECT_TIMEOUT_MS:2000}
support.service.read-timeout-ms=${SUPPORT_SERVICE_READ_TIMEOUT_MS:10000}

# Upload directory for product images (set to persistent disk path on Render)
app.upload-dir=${APP_UPLOAD_DIR:UploadFolder}

# Comma-separated reverse proxies (plain address or CIDR block) whose
# X-Forwarded-For header may be trusted for client-address attribution in
# security logs. Empty (the default) means trust nothing: the container's
# remote address is logged verbatim, so a forged forwarding header can never
# spoof the address recorded next to a failed login. Set it only when a proxy
# you control is guaranteed to overwrite the header, e.g.
# APP_TRUSTED_PROXIES=172.16.0.0/12,10.0.0.7
app.trusted-proxies=${APP_TRUSTED_PROXIES:}

jwt.user-secret=${JWT_USER_SECRET:}
jwt.admin-secret=${JWT_ADMIN_SECRET:}

# Actuator: only the health endpoint is exposed over HTTP. Liveness and
# readiness probes are enabled for the hosting platform, health details and
# components are never public, and readiness includes database connectivity
# because a process without it cannot serve traffic. Liveness deliberately
# excludes the database so a temporary dependency outage does not trigger a
# process restart.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
