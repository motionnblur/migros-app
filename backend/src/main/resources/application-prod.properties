spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAMESITE:None}

support.service.base-url=${SUPPORT_SERVICE_BASE_URL}
app.mail.provider=${APP_MAIL_PROVIDER:resend}

# Comma-separated allowed origins for HTTP CORS and WebSocket handshake
app.allowed-origins=${APP_ALLOWED_ORIGINS}
app.allowed-origin-patterns=${APP_ALLOWED_ORIGIN_PATTERNS:}

# Split public origins. The backend origin owns the signup confirmation endpoint;
# the frontend origin owns the password-reset route. Both must be explicit
# absolute HTTPS origins in production; there is no fallback.
app.frontend-base-url=${APP_FRONTEND_BASE_URL}
app.backend-base-url=${APP_BACKEND_BASE_URL}

# Independent Base64 encoded secrets, at least 32 bytes each, and different from
# one another. Required at startup; there is no fallback. Missing values resolve
# to empty and cause TokenService to fail fast with an IllegalStateException.
jwt.user-secret=${JWT_USER_SECRET:}
jwt.admin-secret=${JWT_ADMIN_SECRET:}
