# Exact-local (hybrid) development.
#
# When the backend is started from the documented `backend/` working directory,
# these optional imports load the ignored local env files. Missing files are
# ignored so a developer can still start with exported variables only. Values
# from a real process environment variable always take precedence over values
# imported from these files.
spring.config.import=optional:file:../configs/spring.env[.properties],optional:file:../configs/postgres.env[.properties]

# Hybrid mode talks to the host-published Postgres on localhost. The Docker
# Compose path derives its own coordinates from the `postgres` service instead.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:migros_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
# Local-only convenience: the fallback password `1` matches the default in
# configs/postgres.env.example so the hybrid workflow starts without exporting
# anything. It must never be used outside this exact-local profile; Compose
# derives its password from POSTGRES_PASSWORD and a non-local deployment has no
# fallback at all.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:1}}

auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAMESITE:Lax}

# Outbound support-service integration is optional. When SUPPORT_SERVICE_BASE_URL
# is unset (in the environment or configs/spring.env) it stays disabled; there is
# no fallback to localhost:3000.
support.service.base-url=${SUPPORT_SERVICE_BASE_URL:}
app.mail.provider=${APP_MAIL_PROVIDER:smtp}
# Local development keeps a usable sender so the SMTP confirmation link can be
# sent without configuring a real identity. Non-local profiles have no fallback
# and fail startup when APP_MAIL_FROM is blank.
app.mail.from=${APP_MAIL_FROM:no-reply@localhost}

# Local-only relative upload root. It is resolved against the documented
# `backend/` working directory, so hybrid development writes product images into
# `backend/UploadFolder`. Outside exact-local development this property has no
# fallback and startup fails when APP_UPLOAD_DIR is missing or blank.
app.upload-dir=${APP_UPLOAD_DIR:UploadFolder}

# Comma-separated allowed origins for HTTP CORS and WebSocket handshake
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5000}
app.allowed-origin-patterns=${APP_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Hybrid development defaults: the Angular dev server serves the reset route and
# the directly started backend serves the signup confirmation endpoint.
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:4200}
app.backend-base-url=${APP_BACKEND_BASE_URL:http://localhost:8080}

# JWT signing keys are intentionally not defined here. Set JWT_USER_SECRET and
# JWT_ADMIN_SECRET in configs/spring.env (or the process environment) for every
# profile, including local. There is no fallback; startup fails when either is
# missing, blank, invalid Base64, shorter than 32 bytes, or identical.
