<div class="admin-shell">
  <div class="admin-sidebar-backdrop" *ngIf="isSidebarOpen" (click)="closeSidebar()"></div>

  <aside class="admin-sidebar" [class.admin-sidebar--open]="isSidebarOpen">
    <a class="admin-sidebar__brand" routerLink="/admin" (click)="closeSidebar()">
      <img [src]="staticImageUrl('migroslogo.png')" class="admin-sidebar__logo" alt="Migros">
      <span class="admin-sidebar__brand-text">Yönetim Paneli</span>
    </a>

    <nav class="admin-sidebar__nav">
      <a
        class="admin-nav-item"
        routerLink="/admin"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidebar()"
      >
        <i class="bi bi-speedometer2"></i><span>Dashboard</span>
      </a>
      <a class="admin-nav-item" routerLink="/admin/products" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-box-seam"></i><span>Ürünler</span>
      </a>
      <a class="admin-nav-item" routerLink="/admin/orders" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-receipt"></i><span>Siparişler</span>
      </a>
      <a class="admin-nav-item" routerLink="/admin/support" routerLinkActive="active" (click)="closeSidebar()">
        <i class="bi bi-chat-dots"></i><span>Canlı Destek</span>
      </a>
    </nav>

    <div class="admin-sidebar__footer">
      <button
        type="button"
        class="admin-nav-item admin-nav-item--danger"
        [disabled]="isLoggingOut"
        (click)="logoutAdmin()"
      >
        <i class="bi bi-box-arrow-right"></i>
        <span>{{ isLoggingOut ? 'Çıkış Yapılıyor...' : 'Çıkış Yap' }}</span>
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <button type="button" class="admin-header__burger" (click)="toggleSidebar()" aria-label="Menüyü aç/kapat">
        <i class="bi bi-list"></i>
      </button>

      <div class="admin-header__titles">
        <h1 class="page-title">{{ sectionTitle }}</h1>
        <p class="page-subtitle">{{ sectionSubtitle }}</p>
      </div>

      <div class="admin-header__account">
        <span class="admin-avatar"><i class="bi bi-person-fill"></i></span>
        <span class="admin-header__account-name">Yönetici</span>
      </div>
    </header>

    <main class="admin-content admin-scroll">
      <div
        class="admin-overlay-container"
        *ngIf="hasProductAdderOpened || hasProductUpdaterOpened || hasProductEditOpened"
      >
        <div class="admin-modal-box animate-fade-in">
          <app-product-adder
            *ngIf="hasProductAdderOpened"
            (hasProductAdded)="productAddedEventHandler($event)"
            (hasEscapePressed)="closeProductAdder()"
          />
          <app-product-updater
            *ngIf="hasProductUpdaterOpened && !hasProductEditOpened"
            [id]="productId"
            (hasProductAdded)="productAddedEventHandler($event)"
            (hasEscapePressed)="closeProductUpdater()"
          />
          <app-product-edit
            *ngIf="hasProductEditOpened"
            [productId]="productId"
            (hasEscapePressed)="closeProductEdit()"
          />
        </div>

        <app-wall class="admin-backdrop" (hasWallOnClicked)="hasWallOnClickedEventAdder($event)" />
      </div>

      <app-dashboard *ngIf="currentSection === 'home'"></app-dashboard>

      <app-product-body *ngIf="hasProductsOpened" (hasAddProductButtonClicked)="openProductAdder()" />

      <app-order-panel *ngIf="hasOrdersOpened" />

      <app-admin-support *ngIf="hasSupportOpened" />
    </main>
  </div>
</div>
