<div class="card-admin h-100 d-flex flex-column">
  <header class="card-admin__header">
    <div class="product-toolbar">
      <div class="dropdown">
        <button
          class="btn btn-ghost dropdown-toggle fw-semibold"
          type="button"
          (click)="isDropdownOpen = !isDropdownOpen"
        >
          <i class="bi bi-funnel me-1"></i> Kategoriler
        </button>

        <ul class="dropdown-menu shadow" [class.show]="isDropdownOpen">
          <li *ngFor="let item of categories">
            <a class="dropdown-item cursor-pointer" (click)="onCategorySelected(item.value); isDropdownOpen = false">
              {{ item.name }}
            </a>
          </li>
        </ul>
      </div>

      <span class="category-chip">
        <i class="bi bi-tag-fill text-brand me-2"></i>{{ selectedCategoryName }}
      </span>
    </div>

    <button class="btn btn-brand px-4" (click)="openProductAdder()">
      <i class="bi bi-plus-lg me-2"></i>Ürün Ekle
    </button>
  </header>

  <div class="card-admin__body flex-grow-1">
    <div class="table-responsive">
      <table class="table-admin">
        <thead>
          <tr>
            <th style="width: 90px;">ID</th>
            <th>Ürün İsmi</th>
            <th class="text-end">İşlemler</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of productsData">
            <td class="text-muted row-clickable" (click)="onBodyClick(item.productId)">#{{ item.productId }}</td>
            <td class="fw-semibold row-clickable" (click)="onBodyClick(item.productId)">{{ item.productName }}</td>
            <td class="text-end">
              <div class="d-inline-flex gap-2">
                <button class="icon-btn icon-btn--edit" (click)="onBodyClick(item.productId)" title="Düzenle">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button class="icon-btn icon-btn--delete" (click)="deleteProduct(item.productId)" title="Sil">
                  <i class="bi bi-trash3"></i>
                </button>
              </div>
            </td>
          </tr>

          <tr *ngIf="productsData.length === 0">
            <td colspan="3">
              <div class="empty-state">
                <i class="bi bi-inbox"></i>
                <span>Bu kategoride henüz ürün bulunmuyor.</span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer class="card-admin__footer">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <small class="text-muted">Toplam {{ productPageLength }} ürün bulundu</small>
      <mat-paginator
        [length]="productPageLength"
        [pageSize]="currentPageSize"
        [pageSizeOptions]="[5, 10, 15, 25]"
        aria-label="Sayfa seç"
        (page)="pageEvent($event)"
      >
      </mat-paginator>
    </div>
  </footer>
</div>
