<div class="product-adder-container h-100 d-flex flex-column">
  <header class="product-adder__header">
    <h2 class="product-adder__title">
      <i class="bi bi-box-seam me-2 text-brand"></i>
      {{ isUpdateMode ? 'Ürün Güncelle' : 'Yeni Ürün Ekle' }}
    </h2>
    <button type="button" class="btn-close" (click)="cancel()" aria-label="Kapat"></button>
  </header>

  <div class="product-adder-main p-4 overflow-auto admin-scroll">
    <div class="mb-4 d-flex justify-content-center">
      <div class="image-upload-wrapper" (click)="openImageUploader()">
        <div
          *ngIf="!imageUrl"
          class="upload-placeholder d-flex flex-column align-items-center justify-content-center"
        >
          <i class="bi bi-camera fs-2"></i>
          <span class="small fw-medium">Resim Ekle</span>
        </div>
        <img *ngIf="imageUrl" [src]="imageUrl" class="upload-preview" alt="Ürün görseli" />
        <div class="upload-hover-overlay">
          <i class="bi bi-pencil-square text-white fs-4"></i>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12">
        <label class="form-label small fw-bold text-uppercase">Ürün Adı</label>
        <input type="text" class="form-control" placeholder="Örn: Süt 1L" [(ngModel)]="productName" />
      </div>

      <div class="col-md-6">
        <label class="form-label small fw-bold text-uppercase">Kategori</label>
        <select class="form-select" [formControl]="categoryControl">
          <option *ngFor="let category of categories" [value]="category.value">
            {{ category.name }}
          </option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-bold text-uppercase">Alt Kategori</label>
        <input type="text" class="form-control" placeholder="Örn: Günlük Süt" [(ngModel)]="subCategoryName" />
      </div>

      <div class="col-md-4">
        <label class="form-label small fw-bold text-uppercase">Fiyat (TL)</label>
        <div class="input-group">
          <input type="number" class="form-control" [(ngModel)]="price" step="0.01" min="0" />
          <span class="input-group-text text-muted">TL</span>
        </div>
      </div>
      <div class="col-md-4">
        <label class="form-label small fw-bold text-uppercase">Miktar</label>
        <input type="number" class="form-control" [(ngModel)]="count" min="0" />
      </div>
      <div class="col-md-4">
        <label class="form-label small fw-bold text-uppercase">İndirim</label>
        <div class="input-group">
          <input type="number" class="form-control" [(ngModel)]="discount" min="0" max="100" />
          <span class="input-group-text text-muted">%</span>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label small fw-bold text-uppercase">Açıklama</label>
        <textarea
          class="form-control"
          rows="3"
          placeholder="Ürün detaylarını girin..."
          [(ngModel)]="description"
        ></textarea>
      </div>

      <!--
        Optional package size. Both fields are left empty by default: an empty
        pair means "this product has no package size", which is what every product
        created before package metadata existed looks like. Nothing is inferred
        from the product name, so a product without a size shows no unit price
        rather than a guess.
      -->
      <div class="col-12">
        <label class="form-label small fw-bold text-uppercase" for="packageAmount">
          Paket Miktarı (isteğe bağlı)
        </label>
        <div class="row g-2">
          <div class="col-8">
            <input
              id="packageAmount"
              type="number"
              class="form-control"
              placeholder="Örn: 1.5 veya 6"
              min="0"
              [step]="packageAmountStep"
              [(ngModel)]="packageAmount"
            />
          </div>
          <div class="col-4">
            <select class="form-select" [(ngModel)]="packageUnit" aria-label="Paket birimi">
              <option value="">Birim yok</option>
              @for (unit of packageUnits; track unit) {
                <option [value]="unit">{{ unit }}</option>
              }
            </select>
          </div>
        </div>
        <p class="form-text">
          Miktar ve birimi birlikte girin. Boş bırakırsanız ürün için paket bilgisi
          gösterilmez.
        </p>
      </div>
    </div>
  </div>

  <footer class="product-adder__footer">
    <div *ngIf="validationError" class="alert alert-danger py-2 mb-3" role="alert">
      {{ validationError }}
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-brand flex-grow-1 py-2 fw-bold" (click)="uploadProductData()">
        <i class="bi bi-cloud-arrow-up-fill me-2"></i>{{ buttonString }}
      </button>
      <button class="btn btn-ghost py-2 px-4 fw-bold" *ngIf="isUpdateMode" (click)="openEditor!()">
        Açıklamaları Düzenle
      </button>
    </div>
  </footer>
</div>

<input
  type="file"
  name="file"
  accept="image/png, image/jpeg"
  class="d-none"
  #imageUploaderRef
  (change)="onImageSelected($event)"
/>
