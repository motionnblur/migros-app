<div class="card-admin h-100 d-flex flex-column">
  <header class="card-admin__header">
    <h2 class="card-admin__title">
      <i class="bi bi-receipt me-2 text-brand"></i>Sipariş Yönetimi
    </h2>
    <span class="badge-status badge-status--neutral">Toplam: {{ totalOrders }} Sipariş</span>
  </header>

  <div class="card-admin__body flex-grow-1">
    <div class="table-responsive">
      <table class="table-admin">
        <thead>
          <tr>
            <th>Sipariş ID</th>
            <th>Toplam Fiyat</th>
            <th>Durum</th>
            <th class="text-end">İşlem</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let element of dataSource">
            <td class="fw-semibold text-muted">#{{ element.orderId }}</td>
            <td class="fw-bold">{{ element.totalPrice | number: '1.2-2' }} TL</td>
            <td>
              <span class="badge-status" [ngClass]="'badge-status--' + orderStatusVariant(element.status)">
                {{ element.status }}
              </span>
            </td>
            <td class="text-end">
              <div class="d-inline-flex gap-2">
                <button
                  class="icon-btn icon-btn--view"
                  (click)="openActionPanel(element.orderId)"
                  title="İşlemleri görüntüle"
                >
                  <i class="bi bi-three-dots-vertical"></i>
                </button>
                <button
                  class="icon-btn icon-btn--delete"
                  [disabled]="deletingOrderId === element.orderId"
                  (click)="deleteOrder(element.orderId)"
                  title="Siparişi sil"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>

          <tr *ngIf="dataSource.length === 0">
            <td colspan="4">
              <div class="empty-state">
                <i class="bi bi-box-seam"></i>
                <span>Henüz sipariş bulunmuyor.</span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer class="card-admin__footer">
    <div class="d-flex justify-content-end align-items-center">
      <mat-paginator
        [length]="totalOrders"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        [pageSizeOptions]="[5, 10, 15]"
        (page)="onPageChange($event)"
      >
      </mat-paginator>
    </div>
  </footer>
</div>

<div class="action-panel-overlay" *ngIf="isActionPanelOpen">
  <app-action-panel [orderId]="orderId" (closeActionPanelEvent)="closeActionPanel()" />
</div>
