<div class="login-card">
  <div class="login-card__header">
    <img [src]="staticImageUrl('migroslogo.png')" alt="Migros" class="brand-logo" />
    <h1 class="login-card__title">Yönetim Paneli</h1>
    <p class="login-card__subtitle">Devam etmek için giriş yapın</p>
  </div>

  <div class="login-card__body">
    <div class="mb-3">
      <label class="form-label fw-bold small text-uppercase">İsim</label>
      <input
        type="text"
        class="form-control py-2"
        [(ngModel)]="adminName"
        placeholder="Admin adınızı girin"
      />
    </div>

    <div class="mb-4">
      <label class="form-label fw-bold small text-uppercase">Şifre</label>
      <div class="input-group">
        <input
          [type]="passwordVisible ? 'text' : 'password'"
          class="form-control py-2"
          [(ngModel)]="adminPassword"
          placeholder="••••••••"
        />
        <button class="btn btn-ghost" type="button" (click)="showPassword()">
          <i class="bi" [ngClass]="passwordVisible ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>
    </div>

    <button
      class="btn btn-brand w-100 py-2 fw-bold"
      [disabled]="!adminName || !adminPassword"
      (click)="login(adminName, adminPassword)"
    >
      <i class="bi bi-box-arrow-in-right me-2"></i>Giriş Yap
    </button>
  </div>

  <div class="login-card__footer">Güvenli Yönetim Paneli</div>
</div>
