<div id="action-panel-bg" (click)="closeActionPanel()"></div>

<div id="action-panel-main" class="card-admin animate-fade-in" *ngIf="userData">
  <header class="card-admin__header action-panel__header">
    <h2 class="card-admin__title"><i class="bi bi-gear-fill me-2 text-brand"></i>Sipariş İşlemi</h2>
    <button type="button" class="btn-close" (click)="closeActionPanel()" aria-label="Kapat"></button>
  </header>

  <div class="card-body p-4">
    <div class="action-panel__customer">
      <h6 class="action-panel__section-label">Müşteri Bilgileri</h6>
      <div class="d-flex align-items-center mb-2">
        <span class="admin-avatar me-2"><i class="bi bi-person-fill"></i></span>
        <span class="fw-bold fs-6">{{ userData.userFirstName }} {{ userData.userLastName }}</span>
      </div>
      <div class="action-panel__detail">
        <i class="bi bi-geo-alt-fill me-1"></i> {{ userData.userAddress }}
      </div>
      <div class="action-panel__detail" *ngIf="userData.userAddress2">
        <i class="bi bi-info-circle me-1"></i> {{ userData.userAddress2 }}
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label fw-bold small text-uppercase">Sipariş Durumunu Güncelle</label>
      <select class="form-select border-2" [(ngModel)]="selectedStatus">
        <option value="" disabled selected>Durum seçiniz...</option>
        <option *ngFor="let s of status" [value]="s.value">{{ s.viewValue }}</option>
      </select>
    </div>

    <button class="btn btn-brand w-100 py-3 fw-bold" [disabled]="!selectedStatus" (click)="save()">
      <i class="bi bi-check-circle-fill me-2"></i>Değişiklikleri Kaydet
    </button>
  </div>

  <footer class="card-admin__footer text-center">
    <small class="text-muted">Sipariş ID: #{{ orderId }}</small>
  </footer>
</div>
