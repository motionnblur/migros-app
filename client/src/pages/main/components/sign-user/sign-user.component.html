<div id="login-component" (click)="closeComponent($event)">
  <!-- Sign Up Phase -->
  <div
    *ngIf="isSignPhaseActive"
    id="login-component-content"
    class="p-4 border rounded shadow-sm bg-light"
  >
    <h4 class="mb-3">Üye Ol</h4>
    <form>
      <!-- Email -->
      <div class="mb-3">
        <label for="loginEmail" class="form-label">E-Posta</label>
        <input
          type="email"
          class="form-control"
          id="loginEmail"
          placeholder="Enter email"
          required
          [(ngModel)]="userMail"
          name="email"
        />
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="loginPassword" class="form-label">Şifre Oluştur</label>
        <div class="password-field">
          <input
            [type]="isPasswordVisible('signUpPassword') ? 'text' : 'password'"
            class="form-control password-field__input"
            id="loginPassword"
            [(ngModel)]="userPassword"
            name="password"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-toggle btn btn-sm btn-outline-secondary"
            [attr.aria-label]="passwordToggleLabel('signUpPassword')"
            [attr.aria-pressed]="isPasswordVisible('signUpPassword')"
            (click)="togglePasswordVisibility('signUpPassword')"
            data-testid="toggle-signup-password"
          >
            <i
              class="bi"
              [ngClass]="
                isPasswordVisible('signUpPassword') ? 'bi-eye-slash' : 'bi-eye'
              "
              aria-hidden="true"
            ></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3">
        <label for="loginPasswordConfirm" class="form-label"
          >Şifreyi Onayla</label
        >
        <div class="password-field">
          <input
            [type]="
              isPasswordVisible('signUpPasswordConfirm') ? 'text' : 'password'
            "
            class="form-control password-field__input"
            id="loginPasswordConfirm"
            [(ngModel)]="userPasswordConfirm"
            name="passwordConfirm"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-toggle btn btn-sm btn-outline-secondary"
            [attr.aria-label]="passwordToggleLabel('signUpPasswordConfirm')"
            [attr.aria-pressed]="isPasswordVisible('signUpPasswordConfirm')"
            (click)="togglePasswordVisibility('signUpPasswordConfirm')"
            data-testid="toggle-signup-password-confirm"
          >
            <i
              class="bi"
              [ngClass]="
                isPasswordVisible('signUpPasswordConfirm')
                  ? 'bi-eye-slash'
                  : 'bi-eye'
              "
              aria-hidden="true"
            ></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button
        id="login-button"
        type="button"
        class="btn btn-primary w-100"
        (click)="signUser()"
      >
        Üye Ol
      </button>

      <div id="login-text" class="mt-3 text-center">
        Zaten üyeysen
        <span
          class="text-warning fw-bold"
          style="cursor: pointer"
          (click)="openLogin()"
          >Giriş Yap</span
        >
      </div>
    </form>
  </div>

  <!-- Login Phase -->
  <div
    *ngIf="isLoginPhaseActive"
    id="login-component-content"
    class="p-4 border rounded shadow-sm bg-light"
  >
    <h4 class="mb-3">Giriş Yap</h4>
    <form>
      <!-- Email -->
      <div class="mb-3">
        <label for="loginEmail2" class="form-label">E-Posta</label>
        <input
          type="email"
          class="form-control"
          id="loginEmail2"
          [(ngModel)]="userMail"
          name="emailLogin"
        />
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="loginPassword2" class="form-label">Şifre</label>
        <div class="password-field">
          <input
            [type]="isPasswordVisible('loginPassword') ? 'text' : 'password'"
            class="form-control password-field__input"
            id="loginPassword2"
            [(ngModel)]="userPassword"
            name="passwordLogin"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle btn btn-sm btn-outline-secondary"
            [attr.aria-label]="passwordToggleLabel('loginPassword')"
            [attr.aria-pressed]="isPasswordVisible('loginPassword')"
            (click)="togglePasswordVisibility('loginPassword')"
            data-testid="toggle-login-password"
          >
            <i
              class="bi"
              [ngClass]="
                isPasswordVisible('loginPassword') ? 'bi-eye-slash' : 'bi-eye'
              "
              aria-hidden="true"
            ></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button
        id="login-button"
        type="button"
        class="btn btn-success w-100"
        (click)="loginUser()"
      >
        Giriş Yap
      </button>

      <div id="login-text" class="mt-3 text-center">
        Üye değilsen
        <span
          class="text-warning fw-bold"
          style="cursor: pointer"
          (click)="openSign()"
          >üye ol</span
        >
      </div>
      <div id="login-text" class="mt-1 text-center">
        Şifreni mi
        <span
          class="text-warning fw-bold"
          style="cursor: pointer"
          (click)="openResetPassword()"
          >unuttun?</span
        >
      </div>
    </form>
  </div>

  <!-- Reset Password Phase -->
  <div
    *ngIf="isResetPasswordPhaseActive"
    id="login-component-content"
    class="p-4 border rounded shadow-sm bg-light"
  >
    <h4 class="mb-3">Şifrenizi sıfırlayın</h4>
    <form>
      <!-- Email -->
      <div class="mb-3">
        <label for="loginEmail2" class="form-label">E-Posta adresiniz</label>
        <input
          type="email"
          class="form-control"
          id="loginEmail2"
          [(ngModel)]="userMail"
          name="emailLogin"
        />
      </div>

      <!-- Submit -->
      <button
        id="login-button"
        type="button"
        class="btn btn-success w-100"
        (click)="verifyUser()"
      >
        Doğrula
      </button>

      <div id="login-text" class="mt-3 text-center">
        Üye değilsen
        <span
          class="text-warning fw-bold"
          style="cursor: pointer"
          (click)="openLogin()"
          >üye ol</span
        >
      </div>
    </form>
  </div>

  <!-- New Password Phase -->
  <div
    *ngIf="isNewPasswordPhaseActive"
    id="login-component-content"
    class="p-4 border rounded shadow-sm bg-light"
  >
    <h4 class="mb-3">Yeni şifrenizi belirleyin</h4>
    <form>
      <!-- New Password -->
      <div class="mb-3">
        <label for="newPassword" class="form-label">Yeni Şifre</label>
        <div class="password-field">
          <input
            [type]="isPasswordVisible('newPassword') ? 'text' : 'password'"
            class="form-control password-field__input"
            id="newPassword"
            [(ngModel)]="userPassword"
            name="newPassword"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-toggle btn btn-sm btn-outline-secondary"
            [attr.aria-label]="passwordToggleLabel('newPassword')"
            [attr.aria-pressed]="isPasswordVisible('newPassword')"
            (click)="togglePasswordVisibility('newPassword')"
            data-testid="toggle-new-password"
          >
            <i
              class="bi"
              [ngClass]="
                isPasswordVisible('newPassword') ? 'bi-eye-slash' : 'bi-eye'
              "
              aria-hidden="true"
            ></i>
          </button>
        </div>
      </div>

      <!-- Confirm New Password -->
      <div class="mb-3">
        <label for="newPasswordConfirm" class="form-label"
          >Yeni Şifreyi Onayla</label
        >
        <div class="password-field">
          <input
            [type]="
              isPasswordVisible('newPasswordConfirm') ? 'text' : 'password'
            "
            class="form-control password-field__input"
            id="newPasswordConfirm"
            [(ngModel)]="userPasswordConfirm"
            name="newPasswordConfirm"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-toggle btn btn-sm btn-outline-secondary"
            [attr.aria-label]="passwordToggleLabel('newPasswordConfirm')"
            [attr.aria-pressed]="isPasswordVisible('newPasswordConfirm')"
            (click)="togglePasswordVisibility('newPasswordConfirm')"
            data-testid="toggle-new-password-confirm"
          >
            <i
              class="bi"
              [ngClass]="
                isPasswordVisible('newPasswordConfirm')
                  ? 'bi-eye-slash'
                  : 'bi-eye'
              "
              aria-hidden="true"
            ></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button
        id="login-button"
        type="button"
        class="btn btn-success w-100"
        (click)="resetPassword()"
      >
        Şifreyi Güncelle
      </button>

      <div id="login-text" class="mt-3 text-center">
        Giriş ekranına
        <span
          class="text-warning fw-bold"
          style="cursor: pointer"
          (click)="openLogin()"
          >dön</span
        >
      </div>
    </form>
  </div>


</div>
