<article class="product-card">
  <a
    class="product-card__link"
    [routerLink]="productLink"
    [queryParams]="browseQueryParams"
  >
    <span class="product-card__media">
      <img
        class="product-card__image"
        [src]="imageUrl || placeholderImage"
        alt=""
        loading="lazy"
        decoding="async"
      />
    </span>
    <span class="product-card__name" [title]="productName">
      {{ productName }}
    </span>
  </a>

  <div class="product-card__body">
    <p class="product-card__stock" [class.product-card__stock--out]="isOutOfStock">
      @if (isOutOfStock) {
        Tükendi
      } @else {
        Stok: {{ productCount }}
      }
    </p>

    <!--
      Package size and unit price, both optional.

      Each line is hidden entirely when the product has no package metadata, which
      is every product created before package metadata existed: no placeholder, no
      "1 adet" derived from the name. The package price below stays the dominant
      number on the card - the unit price is a comparison aid, not the offer.
    -->
    @if (packageSizeText) {
      <p class="product-card__package" [attr.aria-label]="packageSizeAriaLabel">
        <span class="product-card__package-label">Paket</span>
        <span class="product-card__package-value">{{ packageSizeText }}</span>
      </p>
    }

    @if (unitPriceText) {
      <p class="product-card__unit-price">
        <span class="product-card__package-label">Birim fiyat</span>
        <span class="product-card__unit-price-value">{{ unitPriceText }}</span>
      </p>
    }

    <div class="product-card__footer">
      <p class="product-card__price">
        <span class="product-card__amount">{{ productPrice | number: '1.2-2' }}</span>
        <span class="product-card__currency">TL</span>
      </p>

      <button
        type="button"
        class="product-card__add"
        [disabled]="isOutOfStock || isAddingToCart"
        [attr.aria-label]="addButtonLabel"
        (click)="addProductToUserCart()"
      >
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
      </button>
    </div>

    @if (feedbackMessage) {
      <p
        class="product-card__feedback"
        [class.product-card__feedback--success]="feedbackKind === 'success'"
        [class.product-card__feedback--error]="feedbackKind === 'error'"
        [attr.role]="feedbackKind === 'error' ? 'alert' : 'status'"
      >
        {{ feedbackMessage }}
      </p>
    }
  </div>
</article>
