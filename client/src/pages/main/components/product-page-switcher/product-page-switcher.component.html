<nav class="page-switcher" aria-label="Ürün sayfaları">
  <ul class="page-switcher__list">
    <li>
      <button
        type="button"
        class="page-switcher__button page-switcher__button--edge"
        [disabled]="!canGoPrevious"
        aria-label="İlk sayfa"
        (click)="selectFirst()"
      >
        <i class="bi bi-chevron-double-left" aria-hidden="true"></i>
      </button>
    </li>

    <li>
      <button
        type="button"
        class="page-switcher__button"
        [disabled]="!canGoPrevious"
        [attr.aria-label]="'Önceki sayfa, sayfa ' + (normalizedCurrentPage - 1)"
        (click)="selectPrevious()"
      >
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </button>
    </li>

    @for (entry of visiblePages; track $index) {
      <li>
        @if (entry === 'gap') {
          <span class="page-switcher__gap" aria-hidden="true">…</span>
        } @else {
          <button
            type="button"
            class="page-switcher__button"
            [class.is-current]="isCurrentPage(entry)"
            [attr.aria-current]="isCurrentPage(entry) ? 'page' : null"
            [attr.aria-label]="'Sayfa ' + entry"
            (click)="selectPage(entry)"
          >
            {{ entry }}
          </button>
        }
      </li>
    }

    <li>
      <button
        type="button"
        class="page-switcher__button"
        [disabled]="!canGoNext"
        [attr.aria-label]="'Sonraki sayfa, sayfa ' + (normalizedCurrentPage + 1)"
        (click)="selectNext()"
      >
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </button>
    </li>

    <li>
      <button
        type="button"
        class="page-switcher__button page-switcher__button--edge"
        [disabled]="!canGoNext"
        [attr.aria-label]="'Son sayfa, sayfa ' + lastPage"
        (click)="selectLast()"
      >
        <i class="bi bi-chevron-double-right" aria-hidden="true"></i>
      </button>
    </li>
  </ul>

  <p class="page-switcher__status" aria-live="polite">
    Sayfa {{ normalizedCurrentPage }} / {{ normalizedPageCount }}
  </p>
</nav>
