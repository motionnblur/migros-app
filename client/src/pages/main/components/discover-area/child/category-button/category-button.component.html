<a class="category-card" [routerLink]="categoryLink">
  <span class="category-card__media">
    <img
      class="category-card__image"
      [src]="staticImageUrl(image)"
      alt=""
      width="88"
      height="88"
      loading="lazy"
      decoding="async"
      (error)="onImageError($event)"
    />
  </span>

  <span class="category-card__name">{{ name }}</span>
</a>
