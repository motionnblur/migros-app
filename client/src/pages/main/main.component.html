<div class="main-page landing-shell d-flex flex-column min-vh-100">
  <app-site-header
    [searchQuery]="searchQuery"
    (action)="handleHeaderAction($event)"
    (searchSubmitted)="handleSearch($event)"
  />

  <main class="flex-grow-1">
    <div class="container py-4">
      <router-outlet></router-outlet>
    </div>
  </main>

  <app-site-footer (action)="handleFooterAction($event)" />

  <!--
    The launcher belongs to the page behind the modal outlet, so it is withdrawn
    while a dialog is open. The outlet's own `activate`/`deactivate` events are the
    signal: they are emitted by the router as components actually enter and leave
    it, which is also why a navigation the router cancels - or a close held up by
    the cart's CanDeactivate guard - leaves the launcher exactly where it was.
  -->
  <app-support-fab
    [isSuppressed]="isModalOpen"
    (supportRequested)="openSupportChat()"
  />

  <router-outlet
    name="modal"
    (activate)="onModalActivated()"
    (deactivate)="onModalDeactivated()"
  ></router-outlet>
</div>
